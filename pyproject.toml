[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-engineer-agent"
version = "0.1.0"
description = "AI Software Engineer Agent — Meta Hackathon"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Validation and settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # HTTP client (provider API calls)
    "httpx>=0.27",
    # GitHub API
    "PyGithub>=2.3",
    # Git operations
    "gitpython>=3.1",
    # Structured logging
    "structlog>=24.1",
    # Retry / resilience
    "tenacity>=8.3",
    # Hashing utilities (fingerprinting)
    "xxhash>=3.4",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    # Linting and formatting
    "ruff>=0.5",
    # Type checking
    "mypy>=1.10",
    "types-requests>=2.32",
    # HTTPX test transport
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length enforced by formatter

[tool.ruff.lint.isort]
known-first-party = ["agent"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["agent"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure logic tests, no I/O, no network",
    "integration: real filesystem, no network",
    "sandbox: requires Docker daemon",
    "meta_api: requires META_API_KEY env var",
    "slow: >5 s, excluded from default run",
]
addopts = "-m unit --tb=short -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["agent"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
